<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | PRADH DESI FUEL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CSS VARIABLES
           ============================================ */
        :root {
            --primary: #facc15;
            --primary-dark: #eab308;
            --primary-glow: rgba(250, 204, 21, 0.2);
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2a3a4f;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.5);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --whatsapp: #25D366;
            --status-pending: #facc15;
            --status-paid: #22c55e;
            --status-shipped: #3b82f6;
            --status-delivered: #8b5cf6;
            --status-cancelled: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(250, 204, 21, 0.2); }
            50% { box-shadow: 0 0 40px rgba(250, 204, 21, 0.5); }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar-new {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 16px;
            transition: var(--transition);
        }

        .navbar-new.scrolled {
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .nav-container-new {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo-new {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-new img {
            height: 38px;
            width: auto;
            border-radius: 8px;
            transition: var(--transition);
        }

        .logo-new:hover img {
            transform: scale(1.05);
        }

        .logo-text .brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-text .brand span {
            color: var(--primary);
        }

        .logo-text .tagline {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .menu-toggle-new {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            transition: var(--transition);
        }

        .menu-toggle-new:hover {
            background: rgba(255,255,255,0.08);
        }

        .menu-toggle-new span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-light);
            border-radius: 2px;
            transition: var(--transition);
        }

        .menu-toggle-new.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle-new.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-toggle-new.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-links-new {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-links-new li a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .nav-links-new li a i {
            font-size: 15px;
            transition: var(--transition);
        }

        .nav-links-new li a:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.06);
        }

        .nav-links-new li a:hover i {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-links-new li a.active {
            color: var(--primary);
            background: rgba(250, 204, 21, 0.08);
        }

        .nav-links-new li a.active i {
            color: var(--primary);
        }

        .nav-links-new li a.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .cart-badge-new {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            transition: var(--transition);
        }

        .cart-badge-new.visible {
            display: flex;
        }

        .cart-badge-new.pulse {
            animation: pulse 0.4s ease;
        }

        /* ============================================
           PAGE HEADER
           ============================================ */
        .tracking-hero {
            padding: 30px 16px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.03) 0%, transparent 50%);
        }

        .tracking-hero h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
        }

        .tracking-hero h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite;
        }

        .tracking-hero p {
            color: var(--text-muted);
            font-size: clamp(14px, 1.2vw, 17px);
        }

        /* ============================================
           TRACKING PAGE
           ============================================ */
        .tracking-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* --- Search Form --- */
        .search-form {
            display: flex;
            gap: 12px;
            max-width: 550px;
            margin: 0 auto 32px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: var(--transition);
        }

        .search-form:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-form input {
            flex: 1;
            padding: 12px 18px;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 15px;
            outline: none;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .search-form input::placeholder {
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0;
            font-size: 14px;
        }

        .search-form button {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .empty-state i {
            font-size: 60px;
            color: var(--border-color);
            display: block;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
        }

        /* --- Loading State --- */
        .loading-state {
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .loading-state i {
            font-size: 40px;
            color: var(--primary);
            display: block;
            margin-bottom: 12px;
        }

        .loading-state p {
            color: var(--text-muted);
        }

        /* --- Order Card --- */
        .order-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 28px;
            transition: var(--transition);
            animation: fadeIn 0.6s ease;
        }

        .order-card:hover {
            border-color: rgba(250, 204, 21, 0.1);
        }

        .order-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .order-id {
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .order-date {
            color: var(--text-muted);
            font-size: 13px;
        }

        .order-date i {
            margin-right: 4px;
        }

        .order-status {
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-status.pending {
            background: rgba(250, 204, 21, 0.15);
            color: var(--status-pending);
            border: 1px solid rgba(250, 204, 21, 0.15);
        }
        .order-status.paid {
            background: rgba(34, 197, 94, 0.15);
            color: var(--status-paid);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }
        .order-status.shipped {
            background: rgba(59, 130, 246, 0.15);
            color: var(--status-shipped);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }
        .order-status.delivered {
            background: rgba(139, 92, 246, 0.15);
            color: var(--status-delivered);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }
        .order-status.cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: var(--status-cancelled);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        /* --- Order Details Grid --- */
        .order-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .order-detail-item {
            background: rgba(255,255,255,0.02);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .order-detail-item .label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .order-detail-item .value {
            color: #ffffff;
            font-weight: 600;
            margin-top: 2px;
            font-size: 15px;
        }

        .order-detail-item .value.gold {
            color: var(--primary);
        }

        /* --- Items Preview --- */
        .items-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .items-preview .item-tag {
            background: rgba(255,255,255,0.03);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-light);
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .items-preview .item-tag:hover {
            border-color: rgba(250, 204, 21, 0.15);
        }

        .items-preview .item-tag .qty {
            color: var(--primary);
            font-weight: 700;
        }

        .items-preview .more-tag {
            background: rgba(255,255,255,0.02);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed rgba(255,255,255,0.06);
        }

        /* --- Progress Bar --- */
        .progress-container {
            margin: 20px 0 16px;
            padding: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            transition: width 1.2s ease;
            width: 0%;
            position: relative;
        }

        .progress-bar .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 20px;
            height: 100%;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            filter: blur(4px);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .progress-label .current {
            color: var(--primary);
            font-weight: 600;
        }

        /* --- Timeline --- */
        .timeline {
            position: relative;
            padding-left: 44px;
            margin: 8px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.06);
        }

        .timeline-item {
            position: relative;
            padding: 18px 0 18px 28px;
            opacity: 0.4;
            transition: all 0.6s ease;
        }

        .timeline-item.completed {
            opacity: 1;
        }

        .timeline-item.active {
            opacity: 1;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 22px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.06);
            transition: all 0.4s ease;
            z-index: 1;
        }

        .timeline-item.completed::before {
            background: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .timeline-item.active::before {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .timeline-item .icon {
            position: absolute;
            left: -33px;
            top: 18px;
            font-size: 16px;
            color: rgba(255,255,255,0.1);
            transition: all 0.4s ease;
            background: var(--bg-dark);
            padding: 2px;
            border-radius: 50%;
            width: 24px;
            text-align: center;
        }

        .timeline-item.completed .icon {
            color: #22c55e;
        }

        .timeline-item.active .icon {
            color: var(--primary);
        }

        .timeline-item .content .title {
            font-weight: 600;
            color: #ffffff;
            font-size: 15px;
        }

        .timeline-item .content .desc {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .timeline-item .content .time {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.6;
        }

        .timeline-item .content .time i {
            margin-right: 4px;
        }

        /* --- Status Messages --- */
        .status-message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .status-message.delivered {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .status-message.delivered i {
            color: #22c55e;
        }

        .status-message.delivered p {
            color: #22c55e;
        }

        .status-message.cancelled {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .status-message.cancelled i {
            color: #ef4444;
        }

        .status-message.cancelled p {
            color: #ef4444;
        }

        .status-message.shipped {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .status-message.shipped i {
            color: #3b82f6;
        }

        .status-message.shipped p {
            color: #3b82f6;
        }

        .status-message i {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .status-message p {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .status-message .sub {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 14px;
        }

        /* --- Error State --- */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        .error-state i {
            font-size: 60px;
            color: #ef4444;
            display: block;
            margin-bottom: 16px;
        }

        .error-state h3 {
            color: #ef4444;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .error-state p {
            color: var(--text-muted);
        }

        .error-state .btn-retry {
            margin-top: 16px;
            padding: 10px 28px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .error-state .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        /* ============================================
           WHATSAPP FLOATING
           ============================================ */
        .whatsapp-floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: var(--whatsapp);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: var(--transition);
            animation: pulse 3s ease-in-out infinite;
        }

        .whatsapp-floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 35px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-floating-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* ============================================
           FOOTER
           ============================================ */
        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 24px 16px;
        }

        .footer-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .footer-content p {
            color: var(--text-muted);
            font-size: clamp(13px, 1vw, 15px);
        }

        .footer-content p span {
            color: var(--primary);
            font-weight: 600;
        }

        .footer-content .feedback-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(13px, 1vw, 15px);
            transition: var(--transition);
        }

        .footer-content .feedback-link:hover {
            color: var(--primary);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .menu-toggle-new {
                display: flex;
            }

            .nav-links-new {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.98);
                backdrop-filter: blur(20px);
                padding: 12px 16px 24px;
                gap: 2px;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                max-height: calc(100vh - 64px);
                overflow-y: auto;
            }

            .nav-links-new.open {
                display: flex;
            }

            .nav-links-new li a {
                padding: 12px 16px;
                font-size: 15px;
            }

            .nav-links-new li a.active::after {
                display: none;
            }

            .search-form {
                flex-direction: column;
                padding: 12px;
            }

            .search-form button {
                justify-content: center;
                width: 100%;
            }

            .order-card {
                padding: 16px 18px;
            }

            .order-details-grid {
                grid-template-columns: 1fr 1fr;
            }

            .timeline {
                padding-left: 34px;
            }

            .timeline::before {
                left: 14px;
            }

            .timeline-item {
                padding: 14px 0 14px 20px;
            }

            .timeline-item::before {

            .timeline-item .icon {

            .whatsapp-floating-btn {

                height: 50px;
                bottom: 16px;
                right: 16px;
            }

            .whatsapp-floating-btn svg {
                width: 26px;
                height: 26px;
            }

            .progress-label {
                font-size: 11px;
            }

            .items-preview .item-tag {
                font-size: 12px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .tracking-hero h1 {
                font-size: 26px;
            }

            .order-details-grid {
                grid-template-columns: 1fr;
            }

            .order-card {
                padding: 14px;
            }

            .search-form input {
                font-size: 14px;
                padding: 10px 14px;
            }

            .search-form button {
                font-size: 14px;
                padding: 10px 20px;
            }

            .empty-state i {
                font-size: 44px;
            }

            .empty-state h3 {
                font-size: 18px;
            }

            .timeline-item .content .title {
                font-size: 14px;
            }
        }

        @media (min-width: 1025px) {
            .nav-links-new {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar-new" id="navbar">
    <div class="nav-container-new">
        <a href="index.html" class="logo-new">
            <img src="logo.jpeg" alt="PRADH DESI FUEL Logo" loading="lazy">
            <div class="logo-text">
                <span class="brand">PRADH<span>.</span></span>
                <span class="tagline">Desi Fuel</span>
            </div>
        </a>

        <ul class="nav-links-new" id="navLinks">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="product.html"><i class="fas fa-box"></i> Products</a></li>
            <li><a href="about.html"><i class="fas fa-leaf"></i> Our Story</a></li>
            <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
            <li>
                <a href="cart.html" style="position:relative;">
                    <i class="fas fa-shopping-bag"></i> Cart
                    <span class="cart-badge-new" id="cartBadge">0</span>
                </a>
            </li>
        </ul>

        <button class="menu-toggle-new" id="menuToggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<!-- ===== PAGE HEADER ===== -->
<div class="tracking-hero">
    <h1>
        <i class="fas fa-truck" style="color:var(--primary);"></i>
        Track Your <span class="highlight">Order</span>
    </h1>
    <p>Enter your Order ID to see real-time tracking updates</p>
</div>

<!-- ===== TRACKING PAGE ===== -->
<div class="tracking-page">
    <!-- Search Form -->
    <form id="trackForm" class="search-form" onsubmit="trackOrder(event)">
        <input type="text" id="orderInput" placeholder="Enter Order ID (e.g., ORD12345678)" required autocomplete="off">
        <button type="submit">
            <i class="fas fa-search"></i> Track Order
        </button>
    </form>

    <!-- Result Container -->
    <div id="trackingResult">
        <div class="empty-state animate-on-scroll">
            <i class="fas fa-box-open"></i>
            <h3>Enter Your Order ID</h3>
            <p>Enter your order ID above to see tracking details</p>
        </div>
    </div>
</div>

<!-- ===== WHATSAPP FLOATING ===== -->
<a href="https://wa.me/918979993655?text=Hello%20PRADH%20Desi%20Fuel!%20I%20want%20to%20track%20my%20order." 
   class="whatsapp-floating-btn" 
   target="_blank" 
   title="Chat with us on WhatsApp">
    <svg viewBox="0 0 32 32">
        <path d="M16 2a13 13 0 0 0-11.3 19.4L3 29l7.8-2A13 13 0 1 0 16 2zm0 24a11 11 0 0 1-5.6-1.5l-.4-.2-4.6 1.2 1.2-4.5-.3-.4A11 11 0 1 1 16 26zm5.9-8.1c-.3-.2-1.9-1-2.2-1.1-.3-.1-.5-.1-.7.2l-1 1.3c-.2.3-.5.3-.8.1a10.3 10.3 0 0 1-3.7-2.3 11.4 11.4 0 0 1-2.5-3.2c-.2-.4 0-.6.2-.8l.6-.7v-.4c-.2-.5-.7-1.7-1-2.4-.2-.6-.5-.6-.7-.6h-.6a1.3 1.3 0 0 0-1 .4 4.8 4.8 0 0 0-1.5 3.5 8.3 8.3 0 0 0 1.8 4.4 19 19 0 0 0 7.3 6.5c3.5 1.4 4.2 1.1 5 1a4.2 4.2 0 0 0 2.8-2 3.4 3.4 0 0 0 .2-2c-.1-.2-.4-.3-.7-.5z"/>
    </svg>
</a>

<!-- ===== FOOTER ===== -->
<footer>
    <div class="footer-content">
        <p>&copy; 2026 <span>PRADH</span>. All Rights Reserved.</p>
        <a href="https://forms.gle/wybyGnhVKrNikMJV6" target="_blank" class="feedback-link">
            <i class="fas fa-pen"></i> Share Your Feedback
        </a>
    </div>
</footer>

<!-- ===== SCRIPTS ===== -->
<script>
    // ============================================
    // NAVBAR - MOBILE MENU
    // ============================================
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle?.addEventListener('click', function() {
        this.classList.toggle('active');
        navLinks.classList.toggle('open');
    });

    document.querySelectorAll('.nav-links-new a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle?.classList.remove('active');
            navLinks?.classList.remove('open');
        });
    });

    // ============================================
    // NAVBAR - SCROLL EFFECT
    // ============================================
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', function() {
        navbar?.classList.toggle('scrolled', window.scrollY > 50);
    });

    // ============================================
    // CART BADGE
    // ============================================
    function updateCartBadge() {
        try {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = total;
                if (total > 0) {
                    badge.classList.add('visible');
                    badge.classList.remove('pulse');
                    void badge.offsetWidth;
                    badge.classList.add('pulse');
                } else {
                    badge.classList.remove('visible');
                }
            }
        } catch (e) {}
    }

    // ============================================
    // TRACK ORDER - EXACT SAME LOGIC (NO CHANGE)
    // ============================================
    async function trackOrder(event) {
        event.preventDefault();
        
        const input = document.getElementById('orderInput');
        const orderId = input.value.trim();
        
        if (!orderId) {
            showError('Please enter an Order ID');
            return;
        }
        
        const container = document.getElementById('trackingResult');
        container.innerHTML = `
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Tracking your order...</p>
            </div>
        `;
        
        try {
            const response = await fetch(`/api/order/track/${orderId}`);
            const data = await response.json();
            
            if (data.success) {
                renderTracking(data);
            } else {
                showError(data.message || 'Order not found');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Failed to track order. Please try again.');
        }
    }

    // ============================================
    // RENDER TRACKING - IMPROVED VISUALS
    // ============================================
    function renderTracking(data) {
        const container = document.getElementById('trackingResult');
        const { order, timeline, currentStatusIndex, progress } = data;
        
        const statusClass = order.status || 'pending';
        const statusMap = {
            'pending': 'Pending ⏳',
            'paid': 'Paid ✅',
            'shipped': 'Shipped 🚚',
            'delivered': 'Delivered 📦',
            'cancelled': 'Cancelled ❌'
        };
        
        // Get status message
        const statusMessage = {
            'delivered': `
                <div class="status-message delivered">
                    <i class="fas fa-check-circle"></i>
                    <p>🎉 Order Delivered Successfully!</p>
                    <span class="sub">Thank you for shopping with PRADH Desi Fuel!</span>
                </div>
            `,
            'cancelled': `
                <div class="status-message cancelled">
                    <i class="fas fa-times-circle"></i>
                    <p>Order Cancelled</p>
                    <span class="sub">This order has been cancelled.</span>
                </div>
            `,
            'shipped': `
                <div class="status-message shipped">
                    <i class="fas fa-truck"></i>
                    <p>🚚 Your order is on the way!</p>
                    <span class="sub">Track your order in real-time. Delivery in 2-3 business days.</span>
                </div>
            `,
            'paid': `
                <div class="status-message shipped" style="border-color:rgba(34,197,94,0.15);background:rgba(34,197,94,0.08);">
                    <i class="fas fa-credit-card" style="color:#22c55e;"></i>
                    <p style="color:#22c55e;">✅ Payment Confirmed!</p>
                    <span class="sub">Your order is being processed for shipment.</span>
                </div>
            `,
            'pending': `
                <div class="status-message shipped" style="border-color:rgba(250,204,21,0.15);background:rgba(250,204,21,0.08);">
                    <i class="fas fa-clock" style="color:#facc15;"></i>
                    <p style="color:#facc15;">⏳ Order Pending</p>
                    <span class="sub">Your order is waiting for payment confirmation.</span>
                </div>
            `
        };
        
        container.innerHTML = `
            <div class="order-card animate-on-scroll">
                <!-- Order Header -->
                <div class="order-header">
                    <div>
                        <div class="order-id">#${order.id}</div>
                        <div class="order-date">
                            <i class="far fa-calendar-alt"></i> 
                            ${new Date(order.date).toLocaleDateString('en-IN', { 
                                day: '2-digit', 
                                month: 'short', 
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            })}
                        </div>
                    </div>
                    <div>
                        <span class="order-status ${statusClass}">${statusMap[statusClass] || order.status}</span>
                    </div>
                </div>
                
                <!-- Order Details -->
                <div class="order-details-grid">
                    <div class="order-detail-item">
                        <div class="label">Total Amount</div>
                        <div class="value gold">₹${(order.total || 0).toFixed(2)}</div>
                    </div>
                    <div class="order-detail-item">
                        <div class="label">Items</div>
                        <div class="value">${order.items ? order.items.length : 0} products</div>
                    </div>
                    <div class="order-detail-item">
                        <div class="label">Order Status</div>
                        <div class="value" style="color:${statusClass === 'delivered' ? '#22c55e' : statusClass === 'cancelled' ? '#ef4444' : 'var(--primary)'}">
                            ${statusClass.toUpperCase()}
                        </div>
                    </div>
                </div>
                
                <!-- Items Preview -->
                ${order.items && order.items.length > 0 ? `
                    <div class="items-preview">
                        ${order.items.slice(0, 5).map(item => `
                            <span class="item-tag">
                                <span class="qty">${item.quantity}×</span> ${item.name}
                            </span>
                        `).join('')}
                        ${order.items.length > 5 ? `<span class="more-tag">+${order.items.length - 5} more</span>` : ''}
                    </div>
                ` : ''}
                
                <!-- Progress -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%;"></div>
                    </div>
                    <div class="progress-label">
                        <span>Order Placed</span>
                        <span class="current">${progress}% Complete</span>
                        <span>Delivered</span>
                    </div>
                </div>
            </div>
            
            <!-- Timeline -->
            <div class="order-card animate-on-scroll" style="margin-top:20px;">
                <div class="timeline">
                    ${timeline.map((item, index) => {
                        const isActive = index === currentStatusIndex;
                        const isCompleted = item.completed;
                        
                        let statusClass = '';
                        if (isCompleted) statusClass = 'completed';
                        else if (isActive) statusClass = 'active';
                        else statusClass = '';
                        
                        return `
                            <div class="timeline-item ${statusClass}">
                                <span class="icon"><i class="fas ${item.icon}"></i></span>
                                <div class="content">
                                    <div class="title">${item.status}</div>
                                    <div class="desc">${item.description}</div>
                                    ${item.time ? `
                                        <div class="time">
                                            <i class="far fa-clock"></i> 
                                            ${new Date(item.time).toLocaleDateString('en-IN', { 
                                                day: '2-digit', 
                                                month: 'short', 
                                                year: 'numeric',
                                                hour: '2-digit',
                                                minute: '2-digit'
                                            })}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
            
            <!-- Status Message -->
            ${statusMessage[statusClass] || ''}
        `;
        
        // Trigger scroll animations
        setTimeout(() => {
            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                el.classList.add('visible');
            });
        }, 100);
    }

    // ============================================
    // SHOW ERROR - IMPROVED DESIGN
    // ============================================
    function showError(message) {
        const container = document.getElementById('trackingResult');
        container.innerHTML = `
            <div class="error-state animate-on-scroll">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Order Not Found</h3>
                <p>${message}</p>
                <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">Please check your Order ID and try again.</p>
                <button class="btn-retry" onclick="resetTracking()">
                    <i class="fas fa-arrow-left"></i> Try Again
                </button>
            </div>
        `;
        
        setTimeout(() => {
            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                el.classList.add('visible');
            });
        }, 100);
    }

    // ============================================
    // RESET TRACKING
    // ============================================
    function resetTracking() {
        document.getElementById('trackForm').reset();
        document.getElementById('trackingResult').innerHTML = `
            <div class="empty-state animate-on-scroll">
                <i class="fas fa-box-open"></i>
                <h3>Enter Your Order ID</h3>
                <p>Enter your order ID above to see tracking details</p>
            </div>
        `;
        
        setTimeout(() => {
            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                el.classList.add('visible');
            });
        }, 100);
    }

    // ============================================
    // SCROLL ANIMATIONS
    // ============================================
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.animate-on-scroll').forEach(el => {
        observer.observe(el);
    });

    // ============================================
    // AUTO TRACK FROM URL
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();
        
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        
        if (orderId) {
            document.getElementById('orderInput').value = orderId;
            trackOrder(new Event('submit'));
        }
        
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) updateCartBadge();
        });
    });

    // Make functions global
    window.trackOrder = trackOrder;
    window.resetTracking = resetTracking;
    window.updateCartBadge = updateCartBadge;
</script>

</body>
</html>
