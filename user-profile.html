<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PRADH DESI FUEL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============================================
           CSS VARIABLES
           ============================================ */
        :root {
            --primary: #facc15;
            --primary-dark: #eab308;
            --primary-glow: rgba(250, 204, 21, 0.2);
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2a3a4f;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.5);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --whatsapp: #25D366;
            --level-bronze: #cd7f32;
            --level-silver: #c0c0c0;
            --level-gold: #ffd700;
            --level-platinum: #e5e4e2;
            --level-diamond: #b9f2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar-new {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 16px;
            transition: var(--transition);
        }

        .navbar-new.scrolled {
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .nav-container-new {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo-new {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-new img {
            height: 38px;
            width: auto;
            border-radius: 8px;
            transition: var(--transition);
        }

        .logo-new:hover img {
            transform: scale(1.05);
        }

        .logo-text .brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-text .brand span {
            color: var(--primary);
        }

        .logo-text .tagline {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .menu-toggle-new {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            transition: var(--transition);
        }

        .menu-toggle-new:hover {
            background: rgba(255,255,255,0.08);
        }

        .menu-toggle-new span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-light);
            border-radius: 2px;
            transition: var(--transition);
        }

        .menu-toggle-new.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle-new.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-toggle-new.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-links-new {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-links-new li a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .nav-links-new li a i {
            font-size: 15px;
            transition: var(--transition);
        }

        .nav-links-new li a:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.06);
        }

        .nav-links-new li a:hover i {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-links-new li a.active {
            color: var(--primary);
            background: rgba(250, 204, 21, 0.08);
        }

        .nav-links-new li a.active i {
            color: var(--primary);
        }

        .nav-links-new li a.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .cart-badge-new {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            transition: var(--transition);
        }

        .cart-badge-new.visible {
            display: flex;
        }

        .cart-badge-new.pulse {
            animation: pulse 0.4s ease;
        }

        /* ============================================
           PAGE HEADER
           ============================================ */
        .profile-hero {
            padding: 30px 16px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.03) 0%, transparent 50%);
        }

        .profile-hero h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
        }

        .profile-hero h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-hero p {
            color: var(--text-muted);
            font-size: clamp(14px, 1.2vw, 17px);
        }

        /* ============================================
           PROFILE PAGE
           ============================================ */
        .profile-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* --- Profile Card --- */
        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: var(--bg-dark);
            flex-shrink: 0;
            border: 3px solid rgba(250, 204, 21, 0.3);
            position: relative;
        }

        .profile-avatar .edit-overlay {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: var(--transition);
        }

        .profile-avatar .edit-overlay:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .profile-avatar .edit-overlay i {
            font-size: 14px;
            color: var(--primary);
        }

        .profile-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .profile-info .email {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 2px;
        }

        .profile-info .phone {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        .profile-info .phone i {
            color: var(--primary);
            margin-right: 6px;
        }

        .profile-info .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .profile-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-edit {
            padding: 10px 24px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-light);
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(250, 204, 21, 0.15);
        }

        .btn-edit.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
        }

        .btn-edit.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(250, 204, 21, 0.15);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            display: block;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .stat-card .icon {
            font-size: 24px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        /* --- Level Card --- */
        .level-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .level-card .level-icon {
            font-size: 40px;
            color: var(--primary);
        }

        .level-card .level-info h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .level-tag {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .level-tag.bronze { background: rgba(205, 127, 50, 0.2); color: #cd7f32; }
        .level-tag.silver { background: rgba(192, 192, 192, 0.2); color: #c0c0c0; }
        .level-tag.gold { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .level-tag.platinum { background: rgba(229, 228, 226, 0.2); color: #e5e4e2; }
        .level-tag.diamond { background: rgba(185, 242, 255, 0.2); color: #b9f2ff; }

        .level-progress {
            flex: 1;
            min-width: 150px;
        }

        .level-progress .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .level-progress .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
        }

        .level-progress .progress-bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transition: width 1s ease;
            width: 0%;
        }

        /* --- Profile Sections --- */
        .profile-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .profile-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .profile-section h3 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-section h3 i {
            color: var(--primary);
        }

        .profile-section .field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
        }

        .profile-section .field:last-child {
            border-bottom: none;
        }

        .profile-section .field .label {
            color: var(--text-muted);
        }

        .profile-section .field .value {
            color: var(--text-light);
            font-weight: 500;
        }

        /* --- Edit Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            padding: 32px;
            border: 1px solid rgba(255,255,255,0.06);
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.4s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .modal-header h2 {
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h2 i {
            color: var(--primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: #ffffff;
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 14px;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* --- Loading --- */
        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-state i {
            font-size: 40px;
            color: var(--primary);
            display: block;
            margin-bottom: 12px;
        }

        /* ============================================
           WHATSAPP FLOATING
           ============================================ */
        .whatsapp-floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: var(--whatsapp);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: var(--transition);
            animation: pulse 3s ease-in-out infinite;
        }

        .whatsapp-floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 35px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-floating-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* ============================================
           FOOTER
           ============================================ */
        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 24px 16px;
        }

        .footer-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .footer-content p {
            color: var(--text-muted);
            font-size: clamp(13px, 1vw, 15px);
        }

        .footer-content p span {
            color: var(--primary);
            font-weight: 600;
        }

        .footer-content .feedback-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(13px, 1vw, 15px);
            transition: var(--transition);
        }

        .footer-content .feedback-link:hover {
            color: var(--primary);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .menu-toggle-new {
                display: flex;
            }

            .nav-links-new {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.98);
                backdrop-filter: blur(20px);
                padding: 12px 16px 24px;
                gap: 2px;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                max-height: calc(100vh - 64px);
                overflow-y: auto;
            }

            .nav-links-new.open {
                display: flex;
            }

            .nav-links-new li a {
                padding: 12px 16px;
                font-size: 15px;
            }

            .nav-links-new li a.active::after {
                display: none;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 24px;
                gap: 16px;
            }

            .profile-actions {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .profile-sections {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .level-card {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .level-progress {
                width: 100%;
            }

            .whatsapp-floating-btn {
                width: 50px;
                height: 50px;
                bottom: 16px;
                right: 16px;
            }

            .whatsapp-floating-btn svg {
                width: 26px;
                height: 26px;
            }
        }

        @media (max-width: 400px) {
            .profile-card {
                padding: 16px;
            }

            .profile-avatar {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }

            .profile-info h2 {
                font-size: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-card .number {
                font-size: 20px;
            }

            .modal-content {
                padding: 20px;
                margin: 10px;
            }
        }

        @media (min-width: 1025px) {
            .nav-links-new {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar-new" id="navbar">
    <div class="nav-container-new">
        <a href="index.html" class="logo-new">
            <img src="logo.jpeg" alt="PRADH DESI FUEL Logo" loading="lazy">
            <div class="logo-text">
                <span class="brand">PRADH<span>.</span></span>
                <span class="tagline">Desi Fuel</span>
            </div>
        </a>

        <ul class="nav-links-new" id="navLinks">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>

<!-- ===== SCRIPTS ===== -->
<script>
    // ============================================
    // NAVBAR
    // ============================================
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle?.addEventListener('click', function() {
        this.classList.toggle('active');
        navLinks.classList.toggle('open');
    });

    document.querySelectorAll('.nav-links-new a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle?.classList.remove('active');
            navLinks?.classList.remove('open');
        });
    });

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', function() {
        navbar?.classList.toggle('scrolled', window.scrollY > 50);
    });

    // ============================================
    // CART BADGE
    // ============================================
    function updateCartBadge() {
        try {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = total;
                if (total > 0) {
                    badge.classList.add('visible');
                    badge.classList.remove('pulse');
                    void badge.offsetWidth;
                    badge.classList.add('pulse');
                } else {
                    badge.classList.remove('visible');
                }
            }
        } catch (e) {}
    }

    // ============================================
    // CHECK LOGIN
    // ============================================
    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !user) {
            window.location.href = 'userlogin.html';
            return false;
        }
        return true;
    }

    // ============================================
    // GET USER DATA FROM API
    // ============================================
    async function getUserData() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/auth/profile', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch profile');
            }

            const data = await response.json();
            if (data.success) {
                return data.user;
            } else {
                throw new Error(data.message || 'Failed to fetch profile');
            }
        } catch (error) {
            console.error('Error fetching user data:', error);
            // Fallback to localStorage
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (user) {
                return user;
            }
            throw error;
        }
    }

    // ============================================
    // GET USER ORDERS
    // ============================================
    async function getUserOrders(identifier) {
        try {
            const response = await fetch('/get-orders');
            const data = await response.json();
            if (data.success && data.orders) {
                return data.orders.filter(o => 
                    o.customer && (
                        o.customer.phone === identifier ||
                        o.customer.email === identifier ||
                        o.customer.phone === localStorage.getItem('loggedInUser')
                    )
                );
            }
            return [];
        } catch (error) {
            console.error('Error fetching orders:', error);
            return [];
        }
    }

    // ============================================
    // GET LEVEL
    // ============================================
    function getLevel(orders) {
        const count = orders.length;
        if (count >= 50) return { name: 'Diamond', next: 'Max', progress: 100 };
        if (count >= 25) return { name: 'Platinum', next: 'Diamond', progress: ((count - 25) / 25) * 100 };
        if (count >= 10) return { name: 'Gold', next: 'Platinum', progress: ((count - 10) / 15) * 100 };
        if (count >= 5) return { name: 'Silver', next: 'Gold', progress: ((count - 5) / 5) * 100 };
        return { name: 'Bronze', next: 'Silver', progress: (count / 5) * 100 };
    }

    // ============================================
    // RENDER PROFILE
    // ============================================
    async function renderProfile() {
        if (!checkLogin()) return;

        const container = document.getElementById('profilePage');

        try {
            const user = await getUserData();
            const identifier = user.phone || user.email || user.username;
            const orders = await getUserOrders(identifier);

            const totalOrders = orders.length;
            const totalSpent = orders.reduce((sum, o) => sum + (o.total || 0), 0);
            const activeOrders = orders.filter(o => 
                o.status !== 'delivered' && o.status !== 'cancelled'
            ).length;
            const rewards = user.rewards || Math.floor(totalSpent / 100);

            const levelInfo = getLevel(orders);
            const level = levelInfo.name;

            // Recent orders (last 3)
            const recentOrders = orders.slice(-3).reverse();

            container.innerHTML = `
                <!-- Profile Card -->
                <div class="profile-card animate-on-scroll">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                        <div class="edit-overlay" onclick="openEditModal()">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h2>${user.username || user.name || 'User'}</h2>
                        <div class="email"><i class="fas fa-envelope"></i> ${user.email || 'No email'}</div>
                        <div class="phone"><i class="fas fa-phone"></i> ${user.phone || 'No phone'}</div>
                        <span class="status"><i class="fas fa-check-circle"></i> Verified Account</span>
                    </div>
                    <div class="profile-actions">
                        <button class="btn-edit" onclick="openEditModal()">
                            <i class="fas fa-edit"></i> Edit Profile
                        </button>
                        <button class="btn-edit primary" onclick="window.location.href='change-password.html'">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card animate-on-scroll">
                        <span class="icon"><i class="fas fa-shopping-bag"></i></span>
                        <span class="number">${totalOrders}</span>
                        <span class="label">Total Orders</span>
                    </div>
                    <div class="stat-card animate-on-scroll">
                        <span class="icon"><i class="fas fa-clock"></i></span>
                        <span class="number">${activeOrders}</span>
                        <span class="label">Active Orders</span>
                    </div>
                    <div class="stat-card animate-on-scroll">
                        <span class="icon"><i class="fas fa-star"></i></span>
                        <span class="number">${rewards}</span>
                        <span class="label">Rewards Points</span>
                    </div>
                    <div class="stat-card animate-on-scroll">
                        <span class="icon"><i class="fas fa-wallet"></i></span>
                        <span class="number">₹${totalSpent.toFixed(0)}</span>
                        <span class="label">Total Spent</span>
                    </div>
                </div>

                <!-- Level Card -->
                <div class="level-card animate-on-scroll">
                    <div class="level-icon"><i class="fas fa-medal"></i></div>
                    <div class="level-info">
                        <h3>Member Level</h3>
                        <span class="level-tag ${level.toLowerCase()}">${level}</span>
                    </div>
                    <div class="level-progress">
                        <div class="progress-label">
                            <span>Next: ${levelInfo.next}</span>
                            <span>${Math.round(levelInfo.progress)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="fill" style="width:${levelInfo.progress}%"></div>
                        </div>
                    </div>
                </div>

                <!-- Profile Sections -->
                <div class="profile-sections">
                    <div class="profile-section animate-on-scroll">
                        <h3><i class="fas fa-address-card"></i> Personal Details</h3>
                        <div class="field">
                            <span class="label">Username</span>
                            <span class="value">${user.username || 'N/A'}</span>
                        </div>
                        <div class="field">
                            <span class="label">Email</span>
                            <span class="value">${user.email || 'N/A'}</span>
                        </div>
                        <div class="field">
                            <span class="label">Phone</span>
                            <span class="value">${user.phone || 'N/A'}</span>
                        </div>
                        <div class="field">
                            <span class="label">Member Since</span>
                            <span class="value">${user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A'}</span>
                        </div>
                    </div>

                    <div class="profile-section animate-on-scroll">
                        <h3><i class="fas fa-map-marker-alt"></i> Address Details</h3>
                        <div class="field">
                            <span class="label">Address</span>
                            <span class="value">${user.address || 'Not added'}</span>
                        </div>
                        <div class="field">
                            <span class="label">City</span>
                            <span class="value">${user.city || 'Not added'}</span>
                        </div>
                        <div class="field">
                            <span class="label">Pincode</span>
                            <span class="value">${user.pincode || 'Not added'}</span>
                        </div>
                        <div class="field" style="border-bottom:none;padding-top:8px;">
                            <button class="btn-edit" onclick="openEditModal()" style="width:100%;justify-content:center;">
                                <i class="fas fa-plus"></i> Add/Update Address
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders Preview -->
                <div class="profile-section animate-on-scroll" style="margin-top:20px;grid-column:1/-1;">
                    <h3><i class="fas fa-clock"></i> Recent Orders</h3>
                    ${recentOrders.length > 0 ? `
                        ${recentOrders.map(o => `
                            <div class="field" style="cursor:pointer;" onclick="window.location.href='order.html'">
                                <span class="label">#${o.id || o.order_id}</span>
                                <span class="value">₹${(o.total || 0).toFixed(0)} • ${o.status || 'pending'}</span>
                            </div>
                        `).join('')}
                        <div class="field" style="border-bottom:none;padding-top:8px;">
                            <button class="btn-edit" onclick="window.location.href='order.html'" style="width:100%;justify-content:center;">
                                <i class="fas fa-arrow-right"></i> View All Orders
                            </button>
                        </div>
                    ` : `
                        <div style="text-align:center;padding:20px;color:var(--text-muted);">
                            <i class="fas fa-inbox" style="font-size:30px;display:block;margin-bottom:8px;"></i>
                            No orders yet. Start shopping!
                            <br>
                            <button class="btn-edit primary" onclick="window.location.href='product.html'" style="margin-top:10px;">
                                <i class="fas fa-shopping-bag"></i> Shop Now
                            </button>
                        </div>
                    `}
                </div>
            `;

            // Trigger scroll animations
            setTimeout(() => {
                document.querySelectorAll('.animate-on-scroll').forEach(el => {
                    el.classList.add('visible');
                });
            }, 100);

        } catch (error) {
            console.error('Error rendering profile:', error);
            container.innerHTML = `
                <div class="loading-state" style="color:#ef4444;">
                    <i class="fas fa-exclamation-circle"></i>
                    Failed to load profile
                    <p style="font-size:14px;margin-top:8px;">${error.message}</p>
                    <button onclick="renderProfile()" style="background:var(--primary);color:var(--bg-dark);border:none;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px;">
                        <i class="fas fa-sync"></i> Retry
                    </button>
                </div>
            `;
        }
    }

    // ============================================
    // EDIT PROFILE MODAL
    // ============================================
    function openEditModal() {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user) {
            document.getElementById('editName').value = user.username || user.name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPhone').value = user.phone || '';
            document.getElementById('editAddress').value = user.address || '';
            document.getElementById('editCity').value = user.city || '';
            document.getElementById('editPincode').value = user.pincode || '';
        }
        document.getElementById('editModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('open');
        document.body.style.overflow = '';
    }

    // Close modal on overlay click
    document.getElementById('editModal')?.addEventListener('click', function(e) {
        if (e.target === this) closeEditModal();
    });

    // ============================================
    // SAVE PROFILE
    // ============================================
    async function saveProfile(event) {
        event.preventDefault();

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Saving...';

        const data = {
            username: document.getElementById('editName').value.trim(),
            phone: document.getElementById('editPhone').value.trim(),
            address: document.getElementById('editAddress').value.trim(),
            city: document.getElementById('editCity').value.trim(),
            pincode: document.getElementById('editPincode').value.trim()
        };

        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {
                // Update localStorage
                const user = JSON.parse(localStorage.getItem('user') || 'null');
                if (user) {
                    user.username = data.username;
                    user.phone = data.phone;
                    user.address = data.address;
                    user.city = data.city;
                    user.pincode = data.pincode;
                    localStorage.setItem('user', JSON.stringify(user));
                }

                showNotification('✅ Profile updated successfully!');
                closeEditModal();
                setTimeout(renderProfile, 500);
            } else {
                showNotification('❌ ' + (result.message || 'Failed to update profile'), 'error');
            }
        } catch (error) {
            console.error('Error saving profile:', error);
            showNotification('❌ Error saving profile', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '💾 Save Changes';
        }
    }

    // ============================================
    // SHOW NOTIFICATION
    // ============================================
    function showNotification(message, type = 'success') {
        document.querySelectorAll('.notification-toast').forEach(el => el.remove());

        const toast = document.createElement('div');
        toast.className = 'notification-toast' + (type === 'error' ? ' error' : '');
        toast.textContent = message;
        toast.style.cssText = `
            position: fixed;
            bottom: 90px;
            right: 24px;
            padding: 14px 24px;
            background: ${type === 'error' ? '#ef4444' : '#22c55e'};
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 9999;
            font-weight: 500;
            animation: fadeIn 0.4s ease;
            max-width: 340px;
            font-size: 14px;
        `;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 3500);
    }

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();
        renderProfile();

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) updateCartBadge();
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeEditModal();
        });
    });

    // Make functions global
    window.renderProfile = renderProfile;
    window.openEditModal = openEditModal;
    window.closeEditModal = closeEditModal;
    window.saveProfile = saveProfile;
    window.updateCartBadge = updateCartBadge;
    window.showNotification = showNotification;
</script>

</body>
