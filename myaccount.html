<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - PRADH Desi Fuel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============================================
           PREMIUM CSS - NO STRUCTURE CHANGE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================
           ANIMATED BACKGROUND PARTICLES
           ============================================ */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(250, 204, 21, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(250, 204, 21, 0.02) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Floating Particles */
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle-bg span {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(250, 204, 21, 0.08);
            border-radius: 50%;
            animation: floatParticle 20s infinite linear;
        }

        .particle-bg span:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 22s; width: 8px; height: 8px; }
        .particle-bg span:nth-child(2) { left: 30%; animation-delay: 3s; animation-duration: 18s; }
        .particle-bg span:nth-child(3) { left: 50%; animation-delay: 6s; animation-duration: 25s; width: 10px; height: 10px; }
        .particle-bg span:nth-child(4) { left: 70%; animation-delay: 1s; animation-duration: 20s; }
        .particle-bg span:nth-child(5) { left: 90%; animation-delay: 4s; animation-duration: 16s; width: 5px; height: 5px; }
        .particle-bg span:nth-child(6) { left: 20%; animation-delay: 7s; animation-duration: 23s; }
        .particle-bg span:nth-child(7) { left: 60%; animation-delay: 2s; animation-duration: 19s; width: 12px; height: 12px; }
        .particle-bg span:nth-child(8) { left: 80%; animation-delay: 5s; animation-duration: 21s; }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* ============================================
           GLOW ORB
           ============================================ */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbPulse 6s ease-in-out infinite;
        }

        .glow-orb.orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(250, 204, 21, 0.06);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .glow-orb.orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(139, 92, 246, 0.05);
            bottom: -80px;
            left: -80px;
            animation-delay: -3s;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            50% { transform: scale(1.2) translate(20px, -20px); opacity: 1; }
        }

        /* ============================================
           MAIN CONTAINER - Glassmorphism
           ============================================ */
        .account-container {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 44px 40px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: containerFade 0.8s ease-out;
        }

        @keyframes containerFade {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================
           PROFILE HEADER
           ============================================ */
        .profile-header {
            margin-bottom: 32px;
            position: relative;
        }

        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.3), transparent);
            border-radius: 2px;
        }

        .profile-header i {
            font-size: 72px;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            display: inline-block;
            animation: iconFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 20px rgba(250, 204, 21, 0.15));
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .profile-header h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 500;
        }

        .profile-header .user-email {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-header .user-email i {
            font-size: 13px;
            margin-right: 6px;
            -webkit-text-fill-color: #facc15;
            filter: none;
            animation: none;
        }

        .profile-header .user-email span {
            -webkit-text-fill-color: #94a3b8;
        }

        /* ============================================
           ACTION GRID
           ============================================ */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 24px 0 20px;
        }

        .action-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 22px 14px 18px;
            text-decoration: none;
            color: #e2e8f0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(250, 204, 21, 0.02));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .action-card:hover {
            border-color: rgba(250, 204, 21, 0.2);
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(250, 204, 21, 0.03);
            background: rgba(15, 23, 42, 0.7);
        }

        .action-card:hover::before {
            opacity: 1;
        }

        .action-card i {
            font-size: 30px;
            color: #facc15;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .action-card:hover i {
            transform: scale(1.15) translateY(-2px);
            filter: drop-shadow(0 4px 15px rgba(250, 204, 21, 0.2));
        }

        .action-card span {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        /* --- Special Card Styles --- */
        .action-card.logout i {
            color: #ef4444;
        }

        .action-card.logout:hover {
            border-color: rgba(239, 68, 68, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(239, 68, 68, 0.03);
        }

        .action-card.logout:hover i {
            filter: drop-shadow(0 4px 15px rgba(239, 68, 68, 0.2));
        }

        .action-card.login i {
            color: #22c55e;
        }

        .action-card.login:hover {
            border-color: rgba(34, 197, 94, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(34, 197, 94, 0.03);
        }

        .action-card.login:hover i {
            filter: drop-shadow(0 4px 15px rgba(34, 197, 94, 0.2));
        }

        .action-card.dashboard i {
            color: #3b82f6;
        }

        .action-card.dashboard:hover {
            border-color: rgba(59, 130, 246, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(59, 130, 246, 0.03);
        }

        .action-card.dashboard:hover i {
            filter: drop-shadow(0 4px 15px rgba(59, 130, 246, 0.2));
        }

        .action-card.admin-access i {
            color: #8b5cf6;
        }

        .action-card.admin-access:hover {
            border-color: rgba(139, 92, 246, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(139, 92, 246, 0.03);
        }

        .action-card.admin-access:hover i {
            filter: drop-shadow(0 4px 15px rgba(139, 92, 246, 0.2));
        }

        /* --- Card Glow Ring Effect --- */
        .action-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, transparent 40%, rgba(250, 204, 21, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .action-card:hover::after {
            opacity: 1;
        }

        /* ============================================
           ACCOUNT CHECK BOX
           ============================================ */
        .account-check-box {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .account-check-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.15), transparent);
        }

        .account-check-box p {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        .create-account-link {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 34px;
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #0f172a;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.15);
        }

        .create-account-link::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .create-account-link:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(250, 204, 21, 0.3);
        }

        .create-account-link:hover::before {
            opacity: 1;
        }

        .create-account-link:active {
            transform: scale(0.96);
        }

        .logout-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 34px;
            background: transparent;
            color: #ef4444;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.05);
        }

        .logout-btn:active {
            transform: scale(0.96);
        }

        /* ============================================
           RESPONSIVE - Premium Mobile Experience
           ============================================ */
        @media (max-width: 520px) {
            .account-container {
                padding: 28px 18px 24px;
                border-radius: 20px;
                margin: 10px;
            }

            .profile-header i {
                font-size: 56px;
            }

            .profile-header h2 {
                font-size: 22px;
            }

            .action-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .action-card {
                padding: 16px 10px 14px;
                border-radius: 14px;
            }

            .action-card i {
                font-size: 24px;
            }

            .action-card span {
                font-size: 12px;
            }

            .create-account-link,
            .logout-btn {
                padding: 10px 24px;
                font-size: 13px;
                width: 100%;
            }

            .profile-header .user-email {
                font-size: 12px;
                padding: 4px 12px;
            }

            .glow-orb.orb-1 {
                width: 150px;
                height: 150px;
                right: -50px;
            }

            .glow-orb.orb-2 {
                width: 120px;
                height: 120px;
                left: -40px;
            }
        }

        @media (max-width: 380px) {
            .account-container {
                padding: 20px 12px 18px;
            }

            .action-grid {
                gap: 8px;
            }

            .action-card {
                padding: 12px 8px 10px;
                border-radius: 12px;
            }

            .action-card i {
                font-size: 20px;
            }

            .action-card span {
                font-size: 11px;
            }

            .profile-header h2 {
                font-size: 19px;
            }
        }

        @media (min-width: 521px) and (max-width: 768px) {
            .account-container {
                max-width: 460px;
                padding: 36px 32px 30px;
            }
        }
    </style>
</head>
<body>

<!-- ===== ANIMATED BACKGROUND ===== -->
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<div class="particle-bg">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- ===== MAIN CONTAINER ===== -->
<div class="account-container">
    <!-- Profile Header -->
    <div class="profile-header">
        <i class="fas fa-user-circle"></i>
        <h2 id="welcomeUser">Welcome User</h2>
        <p id="userStatus">Manage your account settings</p>
        <div class="user-email" id="userEmailDisplay">
            <i class="fas fa-envelope"></i> <span id="userEmail">Not logged in</span>
        </div>
    </div>

    <!-- Action Grid -->
    <div class="action-grid">
        <!-- Admin Access -->
        <a href="admin.html" class="action-card admin-access">
            <i class="fas fa-user-shield"></i>
            <span>Admin Access</span>
        </a>

        <!-- User Dashboard -->
        <a href="userlogin.html" class="action-card dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span>User Dashboard</span>
        </a>

        <!-- Login / Logout - Dynamic -->
        <a href="#" class="action-card login" id="loginAction">
            <i class="fas fa-sign-in-alt"></i>
            <span id="loginActionText">User Login</span>
        </a>

        <!-- My Orders -->
        <a href="order.html" class="action-card">
            <i class="fas fa-shopping-bag"></i>
            <span>My Orders</span>
        </a>
    </div>

    <!-- Account Check Box -->
    <div class="account-check-box" id="accountCheckBox">
        <p id="accountCheckText">You don't have an account?</p>
        <a href="signup.html" class="create-account-link" id="signupAction">Create Account</a>
    </div>
</div>

<script>
    // ============================================
    // CHECK LOGIN STATUS AND UPDATE UI
    // ============================================
    function updateUI() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        
        const welcomeUser = document.getElementById('welcomeUser');
        const userEmail = document.getElementById('userEmail');
        const userStatus = document.getElementById('userStatus');
        const loginAction = document.getElementById('loginAction');
        const loginActionText = document.getElementById('loginActionText');
        const accountCheckBox = document.getElementById('accountCheckBox');
        const accountCheckText = document.getElementById('accountCheckText');
        const signupAction = document.getElementById('signupAction');
        
        if (token && user) {
            // User is logged in
            welcomeUser.textContent = 'Welcome ' + (user.username || 'User') + '!';
            userEmail.textContent = user.email || 'Not logged in';
            userStatus.textContent = '✅ Logged in successfully';
            userStatus.style.color = '#22c55e';
            
            // Change Login to Logout
            loginAction.className = 'action-card logout';
            loginAction.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>Logout</span>';
            loginAction.href = '#';
            loginAction.onclick = function(e) {
                e.preventDefault();
                if (confirm('Are you sure you want to logout?')) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    localStorage.removeItem('rememberMe');
                    window.location.href = 'index.html';
                }
            };
            
            // Update account check box
            accountCheckText.textContent = 'Manage your account';
            signupAction.textContent = 'Go to Dashboard';
            signupAction.href = 'user-dashboard.html';
            signupAction.className = 'create-account-link';
            
        } else {
            // User is not logged in
            welcomeUser.textContent = 'Welcome Guest';
            userEmail.textContent = 'Please login to access your account';
            userStatus.textContent = '🔒 Not logged in';
            userStatus.style.color = '#94a3b8';
            
            // Login action
            loginAction.className = 'action-card login';
            loginAction.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>User Login</span>';
            loginAction.href = 'userlogin.html';
            loginAction.onclick = null;
            
            // Update account check box
            accountCheckText.textContent = 'You don\'t have an account?';
            signupAction.textContent = 'Create Account';
            signupAction.href = 'signup.html';
            signupAction.className = 'create-account-link';
        }
    }

    // ============================================
    // REDIRECT IF LOGGED IN - BUTTON CLICK
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        updateUI();
    });
</script>

</body>
</html>
