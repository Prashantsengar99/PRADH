<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - PRADH Desi Fuel</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============================================
           CSS VARIABLES - MATCHING INDEX.HTML
           ============================================ */
        :root {
            --primary: #facc15;
            --primary-dark: #eab308;
            --primary-glow: rgba(250, 204, 21, 0.2);
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2a3a4f;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 48px rgba(0,0,0,0.5);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --whatsapp: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ============================================
           SCROLLBAR - MATCHING INDEX
           ============================================ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ============================================
           ANIMATIONS - MATCHING INDEX
           ============================================ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================
           NAVBAR - MATCHING INDEX
           ============================================ */
        .navbar-new {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 16px;
            transition: var(--transition);
        }

        .navbar-new.scrolled {
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .nav-container-new {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo-new {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-new img {
            height: 38px;
            width: auto;
            border-radius: 8px;
            transition: var(--transition);
        }

        .logo-new:hover img {
            transform: scale(1.05);
        }

        .logo-text .brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-text .brand span {
            color: var(--primary);
        }

        .logo-text .tagline {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .menu-toggle-new {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            transition: var(--transition);
        }

        .menu-toggle-new:hover {
            background: rgba(255,255,255,0.08);
        }

        .menu-toggle-new span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-light);
            border-radius: 2px;
            transition: var(--transition);
        }

        .menu-toggle-new.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle-new.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-toggle-new.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-links-new {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-links-new li a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .nav-links-new li a i {
            font-size: 15px;
            transition: var(--transition);
        }

        .nav-links-new li a:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.06);
        }

        .nav-links-new li a:hover i {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-links-new li a.active {
            color: var(--primary);
            background: rgba(250, 204, 21, 0.08);
        }

        .nav-links-new li a.active i {
            color: var(--primary);
        }

        .nav-links-new li a.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .cart-badge-new {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            transition: var(--transition);
        }

        .cart-badge-new.visible {
            display: flex;
        }

        .cart-badge-new.pulse {
            animation: pulse 0.4s ease;
        }

        /* ============================================
           TOOLS BAR - MATCHING INDEX
           ============================================ */
        .header-tools-new {
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-icons-new {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .nav-icons-new a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 10px;
            transition: var(--transition);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-icons-new a:hover {
            color: var(--primary);
            background: rgba(250, 204, 21, 0.08);
            border-color: rgba(250, 204, 21, 0.15);
            transform: translateY(-2px);
        }

        .nav-icons-new a i {
            font-size: 16px;
            transition: var(--transition);
        }

        .nav-icons-new a:hover i {
            transform: scale(1.1);
        }

        .nav-icons-new a.active {
            color: var(--primary);
            border-color: rgba(250, 204, 21, 0.2);
            background: rgba(250, 204, 21, 0.08);
        }

        .search-container-new {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            transition: var(--transition);
            flex: 1;
            min-width: 160px;
            max-width: 320px;
        }

        .search-container-new:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(255,255,255,0.08);
        }

        .search-container-new input {
            background: transparent;
            border: none;
            padding: 8px 14px;
            color: var(--text-light);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-container-new input::placeholder {
            color: #64748b;
            font-size: 12px;
        }

        .search-container-new button {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px 14px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .search-container-new button:hover {
            color: var(--primary);
        }

        /* ============================================
           PAGE HEADER - MATCHING INDEX HERO
           ============================================ */
        .cart-hero {
            padding: 30px 16px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.03) 0%, transparent 50%);
        }

        .cart-hero h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
        }

        .cart-hero h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cart-hero p {
            color: var(--text-muted);
            font-size: clamp(14px, 1.2vw, 17px);
        }

        /* ============================================
           CART PAGE - MATCHING INDEX CARDS
           ============================================ */
        .cart-page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .cart-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 28px 32px;
            box-shadow: var(--shadow);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            gap: 12px;
        }

        .cart-header h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-header h2 i {
            color: var(--primary);
        }

        .cart-count-badge {
            background: var(--primary);
            color: var(--bg-dark);
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
        }

        .delivery-info {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .delivery-info i {
            color: var(--primary);
        }

        .delivery-info .free {
            color: #22c55e;
        }

        /* --- Cart Items --- */
        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: var(--transition);
            animation: fadeInUp 0.5s ease both;
        }

        .cart-item:nth-child(1) { animation-delay: 0.05s; }
        .cart-item:nth-child(2) { animation-delay: 0.1s; }
        .cart-item:nth-child(3) { animation-delay: 0.15s; }
        .cart-item:nth-child(4) { animation-delay: 0.2s; }
        .cart-item:nth-child(5) { animation-delay: 0.25s; }

        .cart-item:hover {
            border-color: rgba(250, 204, 21, 0.1);
            background: rgba(255,255,255,0.04);
        }

        .cart-item-image {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-image .no-image {
            font-size: 28px;
            color: var(--text-muted);
        }

        .cart-item-details {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }

        .cart-item-price {
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
        }

        .cart-item-variant {
            color: var(--text-muted);
            font-size: 12px;
        }

        .cart-item-limit-warning {
            color: #f59e0b;
            font-size: 11px;
            margin-top: 2px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 2px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-btn:hover:not(:disabled) {
            background: var(--primary);
            color: var(--bg-dark);
        }

        .quantity-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .quantity-number {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
        }

        .item-total {
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
            min-width: 80px;
            text-align: right;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        /* --- Cart Summary --- */
        .cart-summary {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        .cart-summary-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cart-summary-right {
            text-align: right;
            min-width: 200px;
        }

        .cart-total-label {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-total-amount {
            color: var(--primary);
            font-size: 32px;
            font-weight: 800;
        }

        .cart-total-sub {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        .cart-total-sub .free {
            color: #22c55e;
        }

        .btn-secondary-cart {
            padding: 10px 24px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-secondary-cart:hover {
            background: rgba(255,255,255,0.04);
            color: #ffffff;
        }

        .btn-danger-cart {
            padding: 10px 24px;
            background: transparent;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-danger-cart:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        .cart-actions {
            width: 100%;
            margin-top: 16px;
        }

        .btn-primary-cart {
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn-primary-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
        }

        /* --- Empty Cart --- */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart .icon {
            font-size: 80px;
            color: var(--border-color);
            margin-bottom: 16px;
            display: block;
        }

        .empty-cart h2 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .empty-cart p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 24px;
        }

        .btn-shop-now {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            transition: var(--transition);
        }

        .btn-shop-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
        }

        /* ============================================
           WHATSAPP FLOATING - MATCHING INDEX
           ============================================ */
        .whatsapp-floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: var(--whatsapp);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: var(--transition);
            animation: pulse 3s ease-in-out infinite;
        }

        .whatsapp-floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 35px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-floating-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* ============================================
           FOOTER - MATCHING INDEX
           ============================================ */
        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 24px 16px;
        }

        .footer-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .footer-content p {
            color: var(--text-muted);
            font-size: clamp(13px, 1vw, 15px);
        }

        .footer-content p span {
            color: var(--primary);
            font-weight: 600;
        }

        .footer-content .feedback-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(13px, 1vw, 15px);
            transition: var(--transition);
        }

        .footer-content .feedback-link:hover {
            color: var(--primary);
        }

        /* ============================================
           TOAST NOTIFICATION
           ============================================ */
        .notification-toast {
            position: fixed;
            bottom: 90px;
            right: 24px;
            padding: 14px 24px;
            background: #22c55e;
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 9999;
            font-weight: 500;
            animation: slideIn 0.4s ease;
            max-width: 340px;
            font-size: 14px;
        }

        .notification-toast.error {
            background: #ef4444;
        }

        /* ============================================
           RESPONSIVE - MATCHING INDEX
           ============================================ */
        @media (max-width: 768px) {
            .menu-toggle-new {
                display: flex;
            }

            .nav-links-new {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.98);
                backdrop-filter: blur(20px);
                padding: 12px 16px 24px;
                gap: 2px;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                max-height: calc(100vh - 64px);
                overflow-y: auto;
            }

            .nav-links-new.open {
                display: flex;
            }

            .nav-links-new li a {
                padding: 12px 16px;
                font-size: 15px;
            }

            .nav-links-new li a.active::after {
                display: none;
            }

            .cart-container {
                padding: 16px;
            }

            .cart-item {
                flex-wrap: wrap;
                padding: 12px 14px;
            }

            .cart-item-actions {
                width: 100%;
                justify-content: space-between;
                margin-top: 8px;

        @media (max-width: 400px) {

            .cart-item {
                padding: 10px 12px;
            }

            .cart-item-name {

            .quantity-control {

            .quantity-btn {
                width: 26px;

            .quantity-number {
                font-size: 13px;
                min-width: 24px;
            }

            .item-total {
                font-size: 13px;
                min-width: 50px;
            }

            .btn-secondary-cart,
            .btn-danger-cart {
                font-size: 12px;
                padding: 8px 14px;
            }

            .btn-primary-cart {
                font-size: 14px;
                padding: 10px 20px;
            }
        }

        @media (min-width: 1025px) {
            .nav-links-new {
                display: flex !important;
            }
        }
    </style>
</head>

<!-- ===== SCRIPTS ===== -->
<script>
    // ============================================
    // NAVBAR - MOBILE MENU
    // ============================================
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle?.addEventListener('click', function() {
        this.classList.toggle('active');
        navLinks.classList.toggle('open');
    });

    document.querySelectorAll('.nav-links-new a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle?.classList.remove('active');
            navLinks?.classList.remove('open');
        });
    });

    // ============================================
    // NAVBAR - SCROLL EFFECT
    // ============================================
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', function() {
        navbar?.classList.toggle('scrolled', window.scrollY > 50);
    });

    // ============================================
    // CART BADGE
    // ============================================
    function updateCartBadge() {
        try {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = total;
                if (total > 0) {
                    badge.classList.add('visible');
                    badge.classList.remove('pulse');
                    void badge.offsetWidth;
                    badge.classList.add('pulse');
                } else {
                    badge.classList.remove('visible');
                }
            }
        } catch (e) {}
    }

    // ============================================
    // GET DELIVERY SETTINGS
    // ============================================
    let deliverySettings = { deliveryCharge: 40, freeDeliveryThreshold: 499 };

    async function getDeliverySettings() {
        try {
            const response = await fetch('/api/delivery-charge');
            const data = await response.json();
            if (data.success) {
                deliverySettings.deliveryCharge = data.deliveryCharge || 40;
                deliverySettings.freeDeliveryThreshold = data.freeDeliveryThreshold || 499;
            }
        } catch (error) {
            console.warn('Using default delivery settings:', error);
        }
    }

    // ============================================
    // GET PRODUCT DETAILS
    // ============================================
    async function getProductDetails(productId) {
        try {
            const response = await fetch('/api/admin/products');
            const data = await response.json();
            if (data.success && data.products) {
                return data.products.find(p => p.id === productId);
            }
            return null;
        } catch (error) {
            console.warn('Error fetching product:', error);
            return null;
        }
    }

    // ============================================
    // LOAD CART
    // ============================================
    async function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const container = document.getElementById('cartItemsContainer');
        updateCartBadgeUI(cart);

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty-cart">
                    <span class="icon">🛒</span>
                    <h2>Your Cart is Empty</h2>
                    <p>Time to fuel your fitness journey! Browse our premium desi blends.</p>
                    <a href="product.html" class="btn-shop-now">
                        <i class="fas fa-shopping-bag"></i> Start Shopping
                    </a>
                </div>
            `;
            return;
        }

        let html = '<div class="cart-items-list">';
        let subtotal = 0;

        for (let index = 0; index < cart.length; index++) {
            const item = cart[index];
            const price = parseFloat(item.price) || 0;
            const qty = parseInt(item.quantity) || 1;
            const itemTotal = price * qty;
            subtotal += itemTotal;

            // Get product limit
            let limit = 0;
            try {
                const response = await fetch('/api/products/' + item.id + '/purchase-limit');
                const data = await response.json();
                limit = data.maxPurchase || 0;
            } catch (e) {}

            const isLimited = limit > 0;
            const maxQty = isLimited ? limit : 999;
            const warningText = isLimited ? '⚠️ Max ' + limit + ' unit(s) allowed' : '';

            html += `
                <div class="cart-item" data-index="${index}">
                    <div class="cart-item-image">
                        ${item.image ? `<img src="${item.image}" alt="${item.name || 'Product'}" loading="lazy">` : `<span class="no-image">💪</span>`}
                    </div>
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name || 'Product'}</div>
                        <div class="cart-item-price">₹${price.toFixed(0)}</div>
                        ${item.variant ? `<div class="cart-item-variant">📦 ${item.variant}</div>` : ''}
                        ${isLimited ? `<div class="cart-item-limit-warning">${warningText}</div>` : ''}
                    </div>
                    <div class="cart-item-actions">
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateQuantity(${index}, -1)" ${qty <= 1 ? 'disabled' : ''}>
                                <i class="fas fa-minus"></i>
                            </button>
                            <span class="quantity-number">${qty}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${index}, 1)" ${qty >= maxQty ? 'disabled' : ''}>
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <div class="item-total">₹${itemTotal.toFixed(0)}</div>
                        <button class="remove-btn" onclick="removeItem(${index})" title="Remove item">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        html += '</div>';

        // Delivery Calculation
        const deliveryCharge = subtotal >= deliverySettings.freeDeliveryThreshold ? 0 : deliverySettings.deliveryCharge;
        const grandTotal = subtotal + deliveryCharge;

        // Delivery Info
        const deliveryInfo = document.getElementById('deliveryInfo');
        if (deliveryInfo) {
            deliveryInfo.innerHTML = `
                <i class="fas fa-truck"></i> 
                ${subtotal >= deliverySettings.freeDeliveryThreshold ? 
                    '<span class="free">✓ Free Delivery</span>' : 
                    `Free above ₹${deliverySettings.freeDeliveryThreshold}`}
            `;
        }

        html += `
            <div class="cart-summary">
                <div class="cart-summary-left">
                    <button class="btn-secondary-cart" onclick="window.location.href='product.html'">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </button>
                    <button class="btn-danger-cart" onclick="clearCart()">
                        <i class="fas fa-trash-alt"></i> Clear Cart
                    </button>
                </div>
                <div class="cart-summary-right">
                    <div class="cart-total-label">Subtotal</div>
                    <div class="cart-total-amount">₹${subtotal.toFixed(0)}</div>
                    <div class="cart-total-sub">
                        ${deliveryCharge > 0 ? 
                            `<i class="fas fa-truck"></i> Delivery: ₹${deliveryCharge.toFixed(0)}` : 
                            '<span class="free"><i class="fas fa-check-circle"></i> Free Delivery</span>'}
                    </div>
                    <div style="margin-top:8px;color:#ffffff;font-size:18px;font-weight:700;">
                        Total: ₹${grandTotal.toFixed(0)}
                    </div>
                </div>
            </div>
            <div class="cart-actions">
                <button class="btn-primary-cart" onclick="proceedToCheckout()">
                    <i class="fas fa-lock"></i> Proceed to Checkout
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        `;

        container.innerHTML = html;
    }

    // ============================================
    // UPDATE QUANTITY
    // ============================================
    async function updateQuantity(index, change) {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (!cart[index]) return;

        const newQuantity = parseInt(cart[index].quantity) + change;
        if (newQuantity < 1) return;

        // Check stock
        const stockCheck = await checkStock(cart[index].id, newQuantity);
        if (!stockCheck.available) {
            showNotification('❌ Only ' + stockCheck.stock + ' items available!', 'error');
            return;
        }

        // Check product limit
        const limit = await getProductLimit(cart[index].id);
        if (limit > 0 && newQuantity > limit) {
            showNotification('❌ Max ' + limit + ' unit(s) allowed for this product', 'error');
            return;
        }

        cart[index].quantity = newQuantity;
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        updateCartBadge();
    }

    // ============================================
    // CHECK STOCK
    // ============================================
    async function checkStock(productId, quantity) {
        try {
            const response = await fetch('/api/products/' + productId + '/stock');
            const data = await response.json();
            if (data.success) {
                return { available: data.stock >= quantity, stock: data.stock };
            }
            return { available: false, stock: 0 };
        } catch (error) {
            console.warn('Stock check failed, allowing:', error);
            return { available: true, stock: 999 };
        }
    }

    // ============================================
    // GET PRODUCT LIMIT
    // ============================================
    async function getProductLimit(productId) {
        try {
            const response = await fetch('/api/products/' + productId + '/purchase-limit');
            const data = await response.json();
            return data.maxPurchase || 0;
        } catch (error) {
            console.warn('Product limit check failed:', error);
            return 0;
        }
    }

    // ============================================
    // REMOVE ITEM
    // ============================================
    function removeItem(index) {
        if (!confirm('Remove this item from your cart?')) return;
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        updateCartBadge();
    }

    // ============================================
    // CLEAR CART
    // ============================================
    function clearCart() {
        if (!confirm('Clear your entire cart?')) return;
        localStorage.removeItem('cart');
        loadCart();
        updateCartBadge();
        showNotification('Cart cleared successfully!');
    }

    // ============================================
    // UPDATE CART BADGE
    // ============================================
    function updateCartBadgeUI(cart) {
        const total = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
        const badge = document.getElementById('cartCountBadge');
        if (badge) badge.textContent = total;
        updateCartBadge();
    }

    // ============================================
    // PROCEED TO CHECKOUT
    // ============================================
    async function proceedToCheckout() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
            showNotification('Your cart is empty!', 'error');
            return;
        }

        // Validate stock
        for (let item of cart) {
            const stockCheck = await checkStock(item.id, item.quantity);
            if (!stockCheck.available) {
                showNotification('❌ "' + item.name + '" only ' + stockCheck.stock + ' items available', 'error');
                return;
            }
        }

        window.location.href = 'checkout.html';
    }

    // ============================================
    // SHOW NOTIFICATION
    // ============================================
    function showNotification(message, type = 'success') {
        document.querySelectorAll('.notification-toast').forEach(el => el.remove());

        const toast = document.createElement('div');
        toast.className = 'notification-toast' + (type === 'error' ? ' error' : '');
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 3500);
    }

    // ============================================
    // SEARCH FUNCTIONALITY
    // ============================================
    document.getElementById('searchBtn')?.addEventListener('click', function() {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
            window.location.href = `product.html?search=${encodeURIComponent(query)}`;
        }
    });

    document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('searchBtn').click();
        }
    });

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', async function() {
        await getDeliverySettings();
        loadCart();

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) loadCart();
        });
    });

    // Make functions global
    window.updateQuantity = updateQuantity;
    window.removeItem = removeItem;
    window.clearCart = clearCart;
    window.loadCart = loadCart;
    window.updateCartBadge = updateCartBadge;
    window.showNotification = showNotification;
    window.proceedToCheckout = proceedToCheckout;
</script>

</body>
